<!DOCTYPE html>
<html lang="sl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <title>Arhiv Projektov | Miha Knific</title>
    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicon.png">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/images/apple-touch-icon.png">
    <meta name="description"
        content="Arhiv vseh projektov, orodij in aplikacij: E-bralnik, Besedomat, Miselni izzivi, Računkomat, UPN Generator, Atlas medijev, Učim.se, PRIPOVEDI in ostalo.">
    <meta name="author" content="Miha Knific">

    <!-- Open Graph za socialne mreže -->
    <meta property="og:title" content="Arhiv Projektov | Miha Knific">
    <meta property="og:description"
        content="Polni arhiv mojih projektov in orodij za poslovanje, izobraževanje in izdelavo.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://mihaknific.github.io/arhiv.html">
    <meta property="og:image" content="https://mihaknific.github.io/assets/images/herobg-hd.webp">
    <meta property="og:site_name" content="Miha Knific - Arhiv Projektov">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Arhiv Projektov | Miha Knific">
    <meta name="twitter:description" content="Arhiv vseh mojih projektov in orodij.">

    <!-- Preload pisave -->
    <link rel="preload" href="assets/fonts/Inter-Variable.ttf" as="font" type="font/ttf" crossorigin>

    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/arhiv.css">
    <meta name="theme-color" content="#1a1a1a">

    <script src="assets/js/fuse.min.js" defer></script>
    <script>
        window.location.replace("index.html" + (window.location.search || "") + "#arhiv");
    </script>
</head>

<body>

    <main class="archive-container">
        <header class="archive-header">
            <a href="index.html#projekti" class="back-link" aria-label="Portfolio">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="24" height="24">
                    <path d="M19 12H5M12 19l-7-7 7-7" />
                </svg>
                <span class="back-link-text">Portfolio</span>
            </a>
            <div class="archive-title-wrapper">
                <h1>ARHIV PROJEKTOV</h1>
                <p>Pobrskaj po vseh preteklih rešitvah, orodjih in aplikacijah.</p>
            </div>
        </header>

        <div id="searchResultsLive" class="sr-only" aria-live="polite" aria-atomic="true"></div>

        <div class="archive-controls-wrapper">
            <div class="controls-row-top">
                <div class="search-group">
                    <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        width="18" height="18">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                    <input type="search" id="searchInput" placeholder="Išči po projektih..."
                        aria-label="Iskanje projektov" aria-controls="projectsContainer">
                </div>

                <div class="view-toggles">
                    <button id="gridViewBtn" class="view-btn active" aria-label="Mrežni pogled (Tipka: G)"
                        aria-pressed="true">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16"
                            height="16">
                            <rect x="3" y="3" width="7" height="7"></rect>
                            <rect x="14" y="3" width="7" height="7"></rect>
                            <rect x="14" y="14" width="7" height="7"></rect>
                            <rect x="3" y="14" width="7" height="7"></rect>
                        </svg>
                        Mreža
                    </button>
                    <button id="listViewBtn" class="view-btn" aria-label="Seznamski pogled (Tipka: L)"
                        aria-pressed="false">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16"
                            height="16">
                            <line x1="8" y1="6" x2="21" y2="6"></line>
                            <line x1="8" y1="12" x2="21" y2="12"></line>
                            <line x1="8" y1="18" x2="21" y2="18"></line>
                            <line x1="3" y1="6" x2="3.01" y2="6"></line>
                            <line x1="3" y1="12" x2="3.01" y2="12"></line>
                            <line x1="3" y1="18" x2="3.01" y2="18"></line>
                        </svg>
                        Seznam
                    </button>
                </div>
            </div>

            <div class="controls-row-bottom">
                <div class="select-group category-group">
                    <label class="select-label" id="categoryLabel" for="categorySelect">Kategorija:</label>
                    <select id="categorySelect" aria-labelledby="categoryLabel"></select>
                </div>

                <div class="select-group sort-group">
                    <label class="select-label" id="sortLabel" for="sortSelect">Razvrsti:</label>
                    <select id="sortSelect" aria-labelledby="sortLabel">
                        <option value="newest">Najnovejše</option>
                        <option value="az">A-Ž</option>
                        <option value="za">Ž-A</option>
                    </select>
                </div>

                <button id="clearFiltersBtn" class="clear-btn" type="button">Ponastavi</button>
            </div>
        </div>

        <div id="projectsContainer" class="archive-projects-container view-grid" role="region"
            aria-label="Seznam projektov">
        </div>

        <div id="noResults" class="no-results hidden">
            <p>Ni projektov, ki bi ustrezali vašemu iskanju.</p>
        </div>

    </main>

    <!-- Kontakt -->
    <section id="contact" class="contact-section">
        <canvas id="contact-canvas" aria-hidden="true"></canvas>
        <div class="contact-container">

            <div class="email-hero">
                <div class="email-row">
                    <button class="email-text interactive" id="email-text" type="button"
                        aria-label="Kopiraj e-poštni naslov">miha.devstudio@gmail.com</button>
                    <button id="copy-email-btn" aria-label="Kopiraj">
                        <svg class="icon-copy" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <rect width="14" height="14" x="8" y="8" rx="2" ry="2" />
                            <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2" />
                        </svg>
                        <svg class="icon-check hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <path d="M20 6 9 17l-5-5" />
                        </svg>
                        <span class="btn-text"></span>
                    </button>
                </div>
                <span id="copy-tooltip">USPEŠNO KOPIRANO</span>
            </div>

            <div class="support-section">
                <p class="support-label">POVEZAVE</p>
                <div class="support-buttons">
                    <a href="https://github.com/mihaknific" target="_blank" rel="noopener noreferrer"
                        class="support-btn support-btn-github" aria-label="GitHub profil">
                        <span class="btn-content">
                            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                                <path fill-rule="evenodd" clip-rule="evenodd"
                                    d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z" />
                            </svg>
                            <span>GitHub</span>
                        </span>
                    </a>
                    <a href="https://linkedin.com/in/mihaknific" target="_blank" rel="noopener noreferrer"
                        class="support-btn support-btn-linkedin" aria-label="LinkedIn profil">
                        <span class="btn-content">
                            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                                <path
                                    d="M19 3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h14m-.5 15.5v-5.3a3.26 3.26 0 0 0-3.26-3.26c-.85 0-1.84.52-2.28 1.3v-1.11h-2.79v8.37h2.79v-4.93c0-.77.62-1.4 1.39-1.4a1.4 1.4 0 0 1 1.4 1.4v4.93h2.75M6.88 8.56a1.68 1.68 0 0 0 1.68-1.68c0-.93-.75-1.69-1.68-1.69a1.69 1.69 0 0 0-1.69 1.69c0 .93.76 1.68 1.69 1.68m1.39 9.94v-8.37H5.5v8.37h2.77z" />
                            </svg>
                            <span>LinkedIn</span>
                        </span>
                    </a>
                    <a href="podpora.html" class="support-btn support-btn-daruj" aria-label="Podpri moje delo z donacijo">
                        <span class="btn-content">
                            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                                <path
                                    d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" />
                            </svg>
                            <span>Podpri</span>
                        </span>
                    </a>
                </div>
            </div>
        </div>

        <div class="footer-line-separator"></div>
        <div class="footer-refined">
            <p>© 2026 MIHA KNIFIC</p>
        </div>
    </section>

    <!-- Skripte -->
    <script src="assets/js/gsap.min.js"></script>
    <script src="assets/js/interactive-grid.js" defer></script>
    <script src="assets/js/contact-module.js" defer></script>
    <script src="assets/js/arhiv.js" defer></script>
</body>

</html>
